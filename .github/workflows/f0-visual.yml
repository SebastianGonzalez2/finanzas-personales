name: F0 visual documentation
on:
  pull_request:
  push:
    branches: [main, codex/F0-02-diseno-visual]
permissions:
  contents: read
jobs:
  visual:
    name: F0 visual documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: node --check docs/design/verify-visual-spec.mjs
      - run: node docs/design/verify-visual-spec.mjs
