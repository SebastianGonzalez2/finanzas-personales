name: F0 auth spike
on:
  pull_request:
  push:
    branches: [main, codex/F0-04-neon-auth-invitaciones]
permissions:
  contents: read
concurrency:
  group: f0-auth-spike-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auth-spike:
    name: F0 auth spike
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: spikes/neon-auth
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: spikes/neon-auth/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run typecheck
      - run: npm test
