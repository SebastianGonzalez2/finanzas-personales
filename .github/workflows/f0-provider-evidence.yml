name: F0 provider evidence
on:
  pull_request:
  push:
    branches: [main, codex/F0-07-viabilidad-proveedores]
permissions:
  contents: read
jobs:
  provider-evidence:
    name: F0 provider evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: node --test scripts/probe-f0-07.test.mjs scripts/verify-f0-07.mjs
